<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taimin - E-commerce de Medicina Chinesa</title>
    <script>
      // Diagnostic script to catch early errors before other scripts load
      (function() {
        var errors = [];
        function showDiagnosticOverlay(title, msg, stack) {
          var overlay = document.getElementById('diag-overlay');
          if (!overlay) {
            overlay = document.createElement('div');
            overlay.id = 'diag-overlay';
            overlay.style.position = 'fixed';
            overlay.style.top = '10px';
            overlay.style.left = '10px';
            overlay.style.right = '10px';
            overlay.style.bottom = '10px';
            overlay.style.background = '#fffbeb';
            overlay.style.border = '3px solid #d97706';
            overlay.style.color = '#78350f';
            overlay.style.padding = '20px';
            overlay.style.zIndex = '9999999';
            overlay.style.overflow = 'auto';
            overlay.style.fontFamily = 'monospace';
            overlay.style.borderRadius = '8px';
            overlay.style.boxShadow = '0 10px 15px -3px rgba(0, 0, 0, 0.1)';
            document.body.appendChild(overlay);
          }
          errors.push({ title: title, msg: msg, stack: stack });
          overlay.innerHTML = '<h2 style="font-size: 1.25rem; font-weight: bold; margin-bottom: 10px;">⚠️ Erro de Diagnóstico de Inicialização</h2>' +
            errors.map(function(e) {
              return '<div style="margin-bottom: 15px; border-bottom: 1px dashed #f59e0b; padding-bottom: 10px;">' +
                '<strong>[' + e.title + ']</strong> ' + e.msg +
                (e.stack ? '<pre style="background: #fef3c7; padding: 10px; margin-top: 5px; font-size: 0.8rem; overflow-x: auto;">' + e.stack + '</pre>' : '') +
                '</div>';
            }).join('') +
            '<button onclick="window.location.reload()" style="background: #d97706; color: white; border: none; padding: 8px 16px; border-radius: 4px; pointer: cursor; font-weight: bold;">Recarregar</button>';
        }

        window.addEventListener('error', function(e) {
          showDiagnosticOverlay('Uncaught Syntax/Runtime Error', e.message, e.error ? e.error.stack : (e.filename + ':' + e.lineno));
        });
        window.addEventListener('unhandledrejection', function(e) {
          showDiagnosticOverlay('Unhandled Promise Rejection', e.reason ? (e.reason.message || String(e.reason)) : 'Unknown rejection', e.reason ? e.reason.stack : null);
        });
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              primary: {
                DEFAULT: '#22543d',
                '50': '#f0fdf4',
                '100': '#dcfce7',
                '200': '#bbf7d0',
                '300': '#86efac',
                '400': '#4ade80',
                '500': '#22c55e',
                '600': '#16a34a',
                '700': '#15803d',
                '800': '#166534',
                '900': '#14532d',
                '950': '#052e16',
              },
            }
          }
        }
      }
    </script>
  <style>
  /* Lock body scroll when cart is open on mobile */
  @media (max-width: 1023px) {
    body.cart-open {
      overflow: hidden;
    }
  }
  .duplicate-watermark::after {
    content: 'DUPLICADO';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(-30deg);
    font-size: 3.5rem;
    font-weight: 800;
    color: rgba(239, 68, 68, 0.1);
    pointer-events: none;
    z-index: 0;
    white-space: nowrap;
    text-align: center;
    width: 100%;
  }
</style>
<link rel="stylesheet" href="/index.css">
</head>
